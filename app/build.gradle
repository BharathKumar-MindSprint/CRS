dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //compile project(":OSMBonusPack")
    implementation 'com.squareup.okhttp3:okhttp:3.7.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'
    implementation 'commons-io:commons-io:2.6'
    implementation('com.auth0.android:jwtdecode:1.2.0') {
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation 'com.android.support:support-v4:27.1.1'
    implementation 'com.android.support:design:27.1.1'
    implementation 'com.android.support:mediarouter-v7:27.1.1'
    implementation 'com.android.support:palette-v7:27.1.1'
    implementation 'com.android.support:cardview-v7:27.1.1'
    implementation 'com.google.firebase:firebase-messaging:11.8.0'
    implementation 'com.google.firebase:firebase-crash:11.8.0'
    implementation 'com.google.firebase:firebase-perf:11.8.0'
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation 'org.osmdroid:osmdroid-mapsforge:5.5:release@aar'
    implementation 'org.mapsforge:mapsforge-map-android:0.6.1'
    implementation 'org.mapsforge:mapsforge-map:0.6.1'
    implementation 'com.google.android.gms:play-services-location:11.8.0'
    implementation 'com.android.support:multidex:1.0.2'
    implementation('com.crashlytics.sdk.android:crashlytics:2.7.1@aar') {
        transitive = true
    }
    implementation 'com.google.firebase:firebase-core:11.8.0'
    implementation 'com.github.MKergall:osmbonuspack:6.4'
    // dexter runtime permissions
    implementation 'com.karumi:dexter:4.2.0'
    implementation 'com.jakewharton.timber:timber:4.7.1'
    //    implementation 'com.auth0.android:jwtdecode:1.2.0'
//    implementation 'com.dynatrace.agent:agent-android:7.+'




    // Required for local unit tests (JUnit 4 framework)
    // Required -- JUnit 4 framework
    testImplementation 'junit:junit:4.12'
    // Optional -- Robolectric environment
    testImplementation 'androidx.test:core:1.0.0'
    // Optional -- Mockito framework
    testImplementation 'org.mockito:mockito-core:1.10.19'
    // Optional - Mock the JSON Object. Because jsonobject will come under instrumentation test.
    testImplementation 'org.json:json:20140107'

    implementation('com.github.danysantiago:sendgrid-android:1') {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
    implementation "com.github.tarek360:instacapture:2.0.1"
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.android.support.constraint:constraint-layout:1.1.2'
    implementation 'com.github.gcacace:signature-pad:1.2.1'
    implementation project(path: ':InAppLib_1.8')
    implementation group: 'net.lingala.zip4j', name: 'zip4j', version: '2.2.6'
    implementation group: 'com.googlecode.libphonenumber', name: 'libphonenumber', version:'8.11.0'

    // User Event Analytics
    implementation 'org.matomo.sdk:tracker:4.1.1'



}

apply plugin: 'com.google.gms.google-services'