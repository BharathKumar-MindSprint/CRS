//noinspection GroovyMissingReturnStatement
android {
    dexOptions {
        preDexLibraries true
        javaMaxHeapSize "4G"
    }
    signingConfigs {
        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
        config {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
    }
    compileSdkVersion 27
    buildToolsVersion '27.0.3'
    flavorDimensions "default"
    defaultConfig {
        applicationId "com.olam.digital.ofis"
        resValue "string", "contentprovider_authorities", applicationId + '.provider'
        resValue "string", "sync_account_type", applicationId
        buildConfigField "String", "ACCOUNT_TYPE", '"com.olam.digital.ofis"'
        minSdkVersion 15
        //noinspection OldTargetApi
        targetSdkVersion 27
        multiDexEnabled true
        versionCode 15
        versionName "10.0.8"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        release {
            lintOptions {
                disable 'MissingTranslation'
                checkReleaseBuilds false
                abortOnError false
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

