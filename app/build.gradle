dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //compile project(":OSMBonusPack")
    implementation 'com.squareup.okhttp3:okhttp:3.7.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'
    implementation 'commons-io:commons-io:2.6'
    implementation('com.auth0.android:jwtdecode:1.2.0') {
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
    implementation 'com.android.support:support-v4:27.0.2'
    implementation 'com.android.support:mediarouter-v7:27.0.2'
    implementation 'com.android.support:palette-v7:27.0.2'
    implementation 'com.android.support:cardview-v7:27.0.2'
    implementation 'com.google.firebase:firebase-messaging:11.8.0'
    implementation 'com.google.firebase:firebase-crash:11.8.0'
    implementation 'com.google.firebase:firebase-perf:11.8.0'
    implementation 'com.android.support:appcompat-v7:27.0.2'
    implementation 'org.osmdroid:osmdroid-mapsforge:5.5:release@aar'
    implementation 'org.mapsforge:mapsforge-map-android:0.6.1'
    implementation 'org.mapsforge:mapsforge-map:0.6.1'
    implementation 'com.google.android.gms:play-services-location:11.8.0'
    implementation 'com.android.support:multidex:1.0.2'
    implementation('com.crashlytics.sdk.android:crashlytics:2.7.1@aar') {
        transitive = true
    }
    implementation 'com.google.firebase:firebase-core:11.8.0'
    implementation 'com.github.MKergall:osmbonuspack:6.4'
    // dexter runtime permissions
    implementation 'com.karumi:dexter:4.2.0'
    implementation 'com.jakewharton.timber:timber:4.1.0'
    //    implementation 'com.auth0.android:jwtdecode:1.2.0'
