//apply plugin: 'com.dynatrace.instrumentation'
plugins {
    id 'com.android.application'
    id 'org.sonarqube'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}



android {
    signingConfigs {
        release {
            keyAlias 'OFIS'
            keyPassword 'Olam123'
            storeFile file('release.keystore')
            storePassword 'Olam123'
        }
        config {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
    }
    compileSdkVersion = 35
    buildToolsVersion ='35.0.0'
    flavorDimensions = ["default"]

    buildFeatures {
        viewBinding = true
    }


    kotlin {
        jvmToolchain(17)
    }


    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }


    defaultConfig {
        applicationId "com.olam.digital.ofis"
        resValue "string", "contentprovider_authorities", applicationId + '.provider'
        resValue "string", "sync_account_type", applicationId
        buildConfigField "String", "ACCOUNT_TYPE", '"com.olam.digital.ofis"'
        minSdkVersion 21
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 35
        multiDexEnabled true
        versionCode 102
        versionName "10.9.4"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }


    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config

        }
        release {
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            minifyEnabled false
            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

        }
    }

