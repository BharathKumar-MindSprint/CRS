android {
    dexOptions {
        preDexLibraries true
        javaMaxHeapSize "4G"
    }
    signingConfigs {
        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
        config {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
    }
    compileSdkVersion 29
    buildToolsVersion '29.0.0'
    flavorDimensions "default"
    defaultConfig {
        applicationId "com.olam.digital.ofis"
        resValue "string", "contentprovider_authorities", applicationId + '.provider'
        resValue "string", "sync_account_type", applicationId
        buildConfigField "String", "ACCOUNT_TYPE", '"com.olam.digital.ofis"'
        minSdkVersion 19
        //noinspection OldTargetApi
        targetSdkVersion 29
        multiDexEnabled true




        versionCode 104
        versionName "10.9.4"




    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        release {
            lintOptions {
                disable 'MissingTranslation'
                checkReleaseBuilds false
                abortOnError false
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

